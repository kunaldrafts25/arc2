name: ARC2 source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy
      - run: python -m pytest -q tests/test_arc2.py tests/test_arc2_neural.py tests/test_arc2_adaptation.py tests/test_arc2_bounded_inference.py
